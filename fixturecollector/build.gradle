plugins {
    id 'com.android.application'
    alias libs.plugins.compose.compiler
}

android {
    namespace 'org.totschnig.fixturecollector'
    compileSdk project.compileSdkVersion

    defaultConfig {
        applicationId 'org.totschnig.fixturecollector'
        minSdk project.minSdkVersion
        targetSdk project.targetSdkVersion
        versionCode 1
        versionName '1.0'
        // Written into each fixture, as another model may read receipts differently
        buildConfigField 'String', 'MLKIT_VERSION', "\"${libs.versions.mlkitTextRecognition.get()}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

// Collects receipt fixtures for the tests of ui_next: photo, recognized text and expected values.
// Recognizes like the mlkit feature of MyExpenses, through :mlkit-core with the Latin recognizer.
dependencies {
    implementation project(':mlkit-core')
    implementation project(':designsystem')
    implementation libs.text.recognition
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.compose.ui
    implementation libs.androidx.compose.material3
    implementation libs.androidx.material.icons.extended

    testImplementation libs.junit
    testImplementation libs.truth
}
