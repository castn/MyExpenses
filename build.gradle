// versionCode derived from versionName major.minor.patch[-alpha|beta|rc.n] (minor, patch < 100, n < 30):
// two digits each for major, minor and patch, two for the prerelease, the final release ending in 99.
// 0.1.0-beta.2 → 10032, 0.1.0-rc.1 → 10061, 0.1.0 → 10099, 1.2.3 → 1020399
def versionCodeOf = { String name ->
    def match = name =~ /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/
    if (!match.matches()) {
        throw new GradleException("versionName '$name' is not major.minor.patch[-alpha|beta|rc.n]")
    }
    def (major, minor, patch) = (1..3).collect { match.group(it) as int }
    def label = match.group(4)
    def number = label ? match.group(5) as int : 0
    if (minor > 99 || patch > 99 || number > 29) {
        throw new GradleException("versionName '$name': minor and patch must be below 100, the prerelease number below 30")
    }
    def prerelease = label ? [alpha: 0, beta: 30, rc: 60][label] + number : 99
    ((major * 100 + minor) * 100 + patch) * 100 + prerelease
}

ext {
    resConfig = ['en', 'en-rGB', 'ar', 'be', 'bg', 'bn', 'ca', 'cs', 'da', 'de', 'de-rDE', 'el', 'es', 'eu', 'fr', 'fr-rCA', "in", 'iw', 'hr', 'hu', 'it', 'ja', 'km', 'kn', 'ko', 'ms', 'nl', 'pl', 'pt-rBR', 'pt-rPT', 'ro', 'ru', 'si', 'sv', 'ta', 'te', 'th', 'tr', 'uk', 'ur', 'vi', 'zh-rCN', 'zh-rHK', 'zh-rTW']
    // Shared by :app (the installed package) and :myExpenses (BuildConfig, resources)
    applicationId = 'de.ausgabenpilot'
    debugApplicationIdSuffix = '.debug'
    releaseApplicationIdSuffix = ''
    versionName = '0.1.0'
    versionCode = versionCodeOf(versionName)
    compileSdkVersion = 37
    minSdkVersion = 26
    targetSdkVersion = 36
}

// Local debug builds only: e.g. myexpenses.abiFilters=arm64-v8a,x86_64 in ~/.gradle/gradle.properties
// packages native libraries (mlkit, sqlcrypt, …) only for these ABIs, which makes the APKs much smaller.
def debugAbiFilters = providers.gradleProperty('myexpenses.abiFilters').orNull
if (debugAbiFilters) {
    subprojects {
        ['com.android.application', 'com.android.dynamic-feature'].each { pluginId ->
            plugins.withId(pluginId) {
                android.buildTypes.debug.ndk.abiFilters.addAll(debugAbiFilters.split(',')*.trim())
            }
        }
    }
}

allprojects { // Or subprojects {
    configurations {
        all { Configuration configuration ->
            configuration.exclude(group: 'com.google.code.findbugs', module: 'jsr305')
        }
    }
}


// Static analysis (detekt) and formatting (ktlint) for every module with Kotlin sources.
// Existing findings are kept in per-module baselines, so only new findings fail the build.
// Run: ./gradlew detekt ktlintCheck
// Refresh baselines: ./gradlew detektBaseline ktlintGenerateBaseline
def ktlintProperties = new Properties()
file("ktlint-plugins.properties").withInputStream { ktlintProperties.load(it) }
def ktlintVersion = ktlintProperties.getProperty("ktlint-version")

subprojects {
    ['com.android.application', 'com.android.library', 'com.android.dynamic-feature', 'org.jetbrains.kotlin.jvm'].each { id ->
        pluginManager.withPlugin(id) {
            if (pluginManager.hasPlugin('dev.detekt')) return
            pluginManager.apply(libs.plugins.detekt.get().pluginId)
            pluginManager.apply(libs.plugins.ktlint.get().pluginId)

            detekt {
                buildUponDefaultConfig = true
                config.setFrom(rootProject.file('config/detekt/detekt.yml'))
                baseline = file('detekt-baseline.xml')
                parallel = true
            }

            ktlint {
                // Shared with the Android Studio ktlint plugin
                version = ktlintVersion
                baseline = file('ktlint-baseline.xml')
                filter {
                    exclude { it.file.path.contains("${File.separator}build${File.separator}") }
                }
            }
            // Their reports hold absolute paths. Taken from the build cache of another worktree,
            // they put that worktree's paths into a regenerated baseline.
            tasks.matching { it.name.startsWith('runKtlintCheckOver') }.configureEach {
                outputs.doNotCacheIf('Reports hold absolute paths') { true }
            }
        }
    }
}

// Everything a branch has to pass before it goes into develop.
// Run: ./gradlew --continue fullCheck
tasks.register('fullCheck') {
    group = 'verification'
    description = 'Builds the app, runs all unit and architecture tests, detekt, ktlint and lint.'
    dependsOn ':ui_next:assembleDebug', ':ui_next:checkModuleGraph', ':myExpenses:lintExternDebug', ':app:lintExternDebug'
    // Only names: creating every task would fail on the Compose preview tasks of ui_next
    dependsOn provider {
        subprojects.collectMany { module ->
            module.tasks.names.findAll {
                it in [
                    'assembleInternDebug', 'testDebugUnitTest', 'testExternDebugUnitTest', 'detekt', 'ktlintCheck'
                ] || (it == 'test' && module.pluginManager.hasPlugin('org.jetbrains.kotlin.jvm'))
            }.collect { "${module.path}:$it" }
        }
    }
}

// Git hooks in config/git-hooks: ktlint on staged files before commit, detekt before push.
// Every Gradle run (including the Android Studio sync) points git at them, unless a hooks path is
// already configured (repository or global) or the build runs on CI. Skip once with --no-verify.
if (System.getenv('CI') == null && file('.git').exists()) {
    def hooksPath = providers.exec {
        commandLine 'git', 'config', '--get', 'core.hooksPath'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (hooksPath.isEmpty()) {
        providers.exec { commandLine 'git', 'config', 'core.hooksPath', 'config/git-hooks' }.result.get()
        logger.lifecycle('Git hooks installed from config/git-hooks')
    }
}
