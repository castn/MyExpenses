buildscript {
    repositories {
//        mavenLocal()
        google()
        mavenCentral()
    }
    dependencies {
//        classpath 'com.jakewharton.hugo:hugo-plugin:1.2.2-SNAPSHOT'
    }
}

plugins {
    id 'com.android.library'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.android.legacy-kapt'
}

def getPropertyIfDefined(property, defaultValue) {
    if (project.hasProperty(property)) {
        return project.properties[property]
    }
    return defaultValue
}

android {
    compileSdk project.compileSdkVersion
    useLibrary 'android.test.runner'
    useLibrary 'android.test.mock'
    useLibrary 'android.test.base'

    defaultConfig {
        minSdkVersion project.minSdkVersion

        // A library has none of these, the app (:app) sets the same values for the package
        buildConfigField "String", "VERSION_NAME", "\"${project.versionName}\""
        buildConfigField "int", "VERSION_CODE", "${project.versionCode}"
        buildConfigField "String", "DISTRIBUTION", "\"GITHUB\""
        testInstrumentationRunner "org.totschnig.myexpenses.MyTestRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Shrinking and signing are set by the app (:app). The label placeholder is set here, because
    // the unit tests merge the manifest of this module without the app.
    buildTypes {
        release {
            manifestPlaceholders["appName"] = "@string/app_name"
        }
        debug {
            manifestPlaceholders["appName"] = "My Expenses Debug"
            // Constant, so that a new commit does not rebuild the module; release gets the real date below
            buildConfigField "java.time.LocalDateTime", "BUILD_DATE", "java.time.LocalDateTime.of(2000, 1, 1, 0, 0)"
            buildConfigField "int", "TEST_SCENARIO", getPropertyIfDefined('testScenario', "1")
            buildConfigField "String", "OPEN_EXCHANGE_RATES_API_KEY", "\"" + getPropertyIfDefined('OPEN_EXCHANGE_RATES_API_KEY', "") + "\""
            buildConfigField "String", "COIN_API_API_KEY", "\"" + getPropertyIfDefined('COIN_API_API_KEY', "") + "\""
            buildConfigField "boolean", "BETA", getPropertyIfDefined("BETA", "false")
        }
    }

    buildTypes.each { type ->
        def applicationId = project.applicationId + project["${type.name}ApplicationIdSuffix"]
        type.buildConfigField "String", "APPLICATION_ID", "\"$applicationId\""
        type.resValue 'string', 'application_id', applicationId
        type.resValue "string", 'sync_account_type', applicationId + ".sync"
    }

    flavorDimensions = [ "textRecognition" ]

    productFlavors {
        intern {
            dimension "textRecognition"
        }
        extern {
            dimension "textRecognition"
        }
    }

    packagingOptions {
        resources {
            //excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*', '**/attach_hotspot_windows.dll', 'META-INF/licenses/**', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
        jniLibs {
            excludes += ['META-INF/*', 'META-INF/licenses/**']
        }
    }

    testOptions {
        targetSdk project.targetSdkVersion
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "1024m"
            }
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    lint {
        targetSdk project.targetSdkVersion
        abortOnError true
        checkDependencies true
        disable 'InvalidPackage', 'MissingQuantity', 'MissingTranslation', 'ImpliedQuantity', 'Instantiatable'
    }

    namespace 'org.totschnig.myexpenses'
}

kotlin.sourceSets.configureEach {
    languageSettings.optIn("kotlin.RequiresOptIn")
}

tasks.withType(Test).configureEach {
    systemProperty "robolectric.logging", "stdout"
    jvmArgs("--add-opens=java.base/jdk.internal.access=ALL-UNNAMED")
