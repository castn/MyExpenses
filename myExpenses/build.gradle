def buildDate = providers.exec {
    workingDir = rootDir
    commandLine 'git', 'show', '--no-patch', '--format=%cd', '--date=format-local:%Y,%-m,%-d,%-H,%-M'
}.standardOutput.asText.map { "java.time.LocalDateTime.of(${it.trim()})".toString() }

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.buildConfigFields.put('BUILD_DATE', buildDate.map {
            new com.android.build.api.variant.BuildConfigField('java.time.LocalDateTime', it, null)
        })
    }
}

//apply plugin: 'com.jakewharton.hugo'

