name: Release

# Builds the signed release APK (flavor intern, with the receipt scanner) for a tag v<versionName>,
# e.g. v0.1.0 or v0.2.0-beta.1, and publishes it as a GitHub release. Tags with a prerelease part
# and all 0.x versions become prereleases.
#
# Secrets of the environment release: RELEASE_KEYSTORE_BASE64 (base64 -w0 release.jks), RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The signing secrets live in this environment, its protection rules (required reviewer)
    # hold every run until it is approved
    environment: release
    steps:
      - uses: actions/checkout@v5

      - name: Check tag against versionName
        run: |
          version=$(sed -n "s/^ *versionName = '\(.*\)'$/\1/p" build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName '$version' in build.gradle"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleInternRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Ausgabenpilot-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/intern/release/app-intern-release.apk "$apk"
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-* | v0.*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Ausgabenpilot ${GITHUB_REF_NAME#v}" \
            --generate-notes $prerelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
